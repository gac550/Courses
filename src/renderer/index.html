<!doctype html>
<html lang="es-419">
  <head>
    <meta charset="UTF-8" />
    <!-- CSP estricta: sin recursos externos, sin eval. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Courses</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body class="shell">
    <!-- 1. Titlebar: identidad e indicadores del catálogo -->
    <header class="titlebar">
      <div class="titlebar__brand">
        <h1 class="titlebar__title">Courses</h1>
        <p class="titlebar__subtitle">Catálogo verificable</p>
      </div>

      <div class="titlebar__stats" id="dashboard" aria-label="Resumen del catálogo"></div>
    </header>

    <!--
      2. Ribbon bar: cada acción es icono SVG, salto de línea y título.
      Los SVG van embebidos: sin dependencias ni recursos externos.
    -->
    <div class="ribbon" role="toolbar" aria-label="Acciones">
      <div class="ribbon__group">
        <div class="ribbon__buttons">
        <button id="btn-update" type="button" class="ribbon__btn ribbon__btn--primary">
          <svg class="ribbon__icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M20 12a8 8 0 1 1-2.34-5.66" />
            <polyline points="20 4 20 10 14 10" />
          </svg>
          <span class="ribbon__text">Actualizar</span>
        </button>

        <button id="btn-reset" type="button" class="ribbon__btn">
          <svg class="ribbon__icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M3 5h18l-7 8v6l-4 2v-8z" />
          </svg>
          <span class="ribbon__text">Limpiar</span>
        </button>
      </div>
        <span class="ribbon__label">Acciones</span>
      </div>

      <!-- Grupo: cursos de proveedores de modelos de IA -->
      <div class="ribbon__group ribbon__group--divider">
        <div class="ribbon__buttons">
        <button type="button" class="ribbon__btn" data-provider="proveedor-ia">
          <svg class="ribbon__icon" viewBox="0 0 24 24" aria-hidden="true">
            <rect x="4" y="4" width="16" height="16" rx="3" />
            <circle cx="9.5" cy="10" r="1.4" />
            <circle cx="14.5" cy="10" r="1.4" />
            <path d="M9 15h6" />
          </svg>
          <span class="ribbon__text">Todos</span>
        </button>

        <button type="button" class="ribbon__btn" data-institution="Anthropic">
          <svg class="ribbon__icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M7 19 12 5l5 14" />
            <path d="M9.2 14h5.6" />
          </svg>
          <span class="ribbon__text">Anthropic</span>
        </button>

        <button type="button" class="ribbon__btn" data-institution="OpenAI">
          <svg class="ribbon__icon" viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="12" r="7.5" />
            <circle cx="12" cy="12" r="3" />
          </svg>
          <span class="ribbon__text">OpenAI</span>
        </button>

        <button type="button" class="ribbon__btn" data-institution="Google">
          <svg class="ribbon__icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 4.5 14 10l5.5 2-5.5 2-2 5.5-2-5.5L4.5 12 10 10z" />
          </svg>
          <span class="ribbon__text">Google</span>
        </button>
        </div>
        <span class="ribbon__label">Proveedores de IA</span>
      </div>

      <!-- Grupo: cursos de universidades y organismos -->
      <div class="ribbon__group ribbon__group--divider">
        <div class="ribbon__buttons">
        <button type="button" class="ribbon__btn" data-provider="institucion">
          <svg class="ribbon__icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 4 2.5 9 12 14l9.5-5z" />
            <path d="M6 11.5V17c0 1.5 2.7 3 6 3s6-1.5 6-3v-5.5" />
          </svg>
          <span class="ribbon__text">Todas</span>
        </button>

        <button type="button" class="ribbon__btn" data-institution="Massachusetts Institute of Technology">
          <svg class="ribbon__icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M4 20V6M8 20V6M12 20V6M16 20V6M20 20V6" />
            <path d="M3 20h18" />
          </svg>
          <span class="ribbon__text">MIT</span>
        </button>

        <button type="button" class="ribbon__btn" data-institution="Harvard University">
          <svg class="ribbon__icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M5 20V9l7-4 7 4v11" />
            <path d="M9.5 20v-5h5v5" />
          </svg>
          <span class="ribbon__text">Harvard</span>
        </button>

        <button type="button" class="ribbon__btn" data-domain="pmo">
          <svg class="ribbon__icon" viewBox="0 0 24 24" aria-hidden="true">
            <rect x="3.5" y="5" width="17" height="15" rx="2" />
            <path d="M3.5 9.5h17M8 3.5v3M16 3.5v3" />
          </svg>
          <span class="ribbon__text">PMO</span>
        </button>
        </div>
        <span class="ribbon__label">Instituciones</span>
      </div>

      <div class="ribbon__group ribbon__group--divider" role="group" aria-label="Exportar">
        <div class="ribbon__buttons">
        <button type="button" class="ribbon__btn" data-export="csv">
          <svg class="ribbon__icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z" />
            <polyline points="14 3 14 8 19 8" />
          </svg>
          <span class="ribbon__text">CSV</span>
        </button>

        <button type="button" class="ribbon__btn" data-export="md">
          <svg class="ribbon__icon" viewBox="0 0 24 24" aria-hidden="true">
            <rect x="3" y="6" width="18" height="12" rx="2" />
            <path d="M6.5 15V9l3 3.5L13 9v6M17 9v6M15 13l2 2 2-2" />
          </svg>
          <span class="ribbon__text">Markdown</span>
        </button>

        <button type="button" class="ribbon__btn" data-export="json">
          <svg class="ribbon__icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M9 4H8a2 2 0 0 0-2 2v3a2 2 0 0 1-2 2 2 2 0 0 1 2 2v3a2 2 0 0 0 2 2h1" />
            <path d="M15 4h1a2 2 0 0 1 2 2v3a2 2 0 0 0 2 2 2 2 0 0 0-2 2v3a2 2 0 0 1-2 2h-1" />
          </svg>
          <span class="ribbon__text">JSON</span>
        </button>
        </div>
        <span class="ribbon__label">Exportar</span>
      </div>

      <div class="ribbon__spacer"></div>

      <div class="ribbon__group">
        <label class="field field--inline">
          <span class="field__label">Tema</span>
          <select id="theme" class="field__input field__input--compact">
            <option value="light">Claro</option>
            <option value="dark">Oscuro</option>
            <option value="auto">Automático</option>
          </select>
        </label>
      </div>
    </div>

    <!-- 3. Cuerpo: sidebar izquierda + centro + sidebar derecha -->
    <div class="workspace">
      <aside class="sidebar sidebar--left" aria-label="Filtros">
        <h2 class="sidebar__title">Filtros</h2>

        <div class="filters__group" id="filter-selects"></div>

        <div class="filters__group">
          <label class="field">
            <span class="field__label">Relevancia mínima</span>
            <select id="filter-minRelevance" class="field__input">
              <option value="">Cualquiera</option>
              <option value="1">1 o más</option>
              <option value="2">2 o más</option>
              <option value="3">3</option>
            </select>
          </label>

          <label class="checkbox">
            <input type="checkbox" id="filter-credentialFree" />
            <span>Solo credencial gratuita</span>
          </label>

          <label class="checkbox">
            <input type="checkbox" id="filter-credentialVerifiable" />
            <span>Solo credencial verificable</span>
          </label>
        </div>
      </aside>

      <main class="center">
        <!-- Hero del body: búsqueda, conteo y orden -->
        <section class="hero" aria-label="Búsqueda y orden">
          <div class="hero__search">
            <label class="field">
              <span class="field__label">Buscar en el catálogo</span>
              <input
                type="search"
                id="filter-search"
                class="field__input field__input--hero"
                placeholder="Título, institución, tema o código de curso"
                autocomplete="off"
              />
            </label>
          </div>

          <div class="hero__meta">
            <p class="hero__count" id="results-count" role="status" aria-live="polite"></p>

            <label class="field field--inline">
              <span class="field__label">Ordenar por</span>
              <select id="sort" class="field__input">
                <option value="recomendado">Prioridad recomendada</option>
                <option value="acreditabilidad">Acreditabilidad</option>
                <option value="relevancia">Relevancia</option>
                <option value="institucion">Institución</option>
                <option value="duracion">Duración</option>
                <option value="verificacion">Fecha de verificación</option>
              </select>
            </label>
          </div>
        </section>

        <!-- Body: resultados -->
        <section class="body" aria-label="Resultados">
          <div id="cards" class="cards"></div>
        </section>
      </main>

      <aside class="sidebar sidebar--right" aria-label="Composición del catálogo">
        <h2 class="sidebar__title">Composición</h2>
        <div id="breakdown" class="breakdown"></div>
      </aside>
    </div>

    <!-- 4. Statusbar -->
    <footer class="statusbar" aria-label="Estado">
      <span class="statusbar__item" id="status-count"></span>
      <span class="statusbar__item" id="status-verification"></span>
      <span class="statusbar__spacer"></span>
      <span class="statusbar__item" id="status-pipeline">Listo</span>
    </footer>

    <!--
      Consola del pipeline como modal nativo. <dialog> aporta el foco atrapado,
      el cierre con Escape y el backdrop sin JavaScript adicional.
    -->
    <dialog id="pipeline" class="pipeline" aria-labelledby="pipeline-title">
      <div class="pipeline__header">
        <h2 class="pipeline__title" id="pipeline-title">Actualización del catálogo</h2>
        <span class="pipeline__state" id="pipeline-state"></span>
        <button type="button" id="pipeline-close" class="button button--ghost">Cerrar</button>
      </div>

      <pre id="pipeline-log" class="pipeline__log" role="log" aria-live="polite"></pre>

      <div class="pipeline__footer">
        <button type="button" id="pipeline-done" class="button button--primary">Cerrar</button>
      </div>
    </dialog>

    <script type="module" src="./main.js"></script>
  </body>
</html>
